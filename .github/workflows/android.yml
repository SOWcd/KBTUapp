# The Android app for Google Play (android/README.md): a Trusted Web Activity over kbtu.sow.kz, generated by Bubblewrap
# from android/twa-manifest.json and built here only. Run by hand (Actions -> Android -> Run workflow): a .aab signed
# with the upload key from the repo secrets ANDROID_UPLOAD_KEYSTORE (base64 of the .jks) and ANDROID_UPLOAD_PASSWORD.
# A PR that touches android/ builds the same way with a throwaway key and keeps nothing.
name: Android
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode: a whole number, bigger than any uploaded to Play before"
        required: true
      version_name:
        description: "versionName people see in the store"
        required: true
        default: "1.0.0"
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      CODE: ${{ inputs.version_code || '1' }}
      NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate the Android project from twa-manifest.json
        run: |
          [[ "$CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::version_code must be a whole number"; exit 1; }
          [[ "$NAME" =~ ^[0-9A-Za-z.+-]{1,40}$ ]] || { echo "::error::version_name: letters, digits and . + - only"; exit 1; }
          # the icons come from this commit's web/public, not the live site: a new icon builds before it is deployed
          (cd ../web/public && exec python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1) &
          sleep 1
          jq --argjson c "$CODE" --arg n "$NAME" '.appVersionCode = $c | .appVersionName = $n
            | (.iconUrl, .maskableIconUrl) |= sub("^https://kbtu\\.sow\\.kz/"; "http://127.0.0.1:8765/")' twa-manifest.json > m.json && mv m.json twa-manifest.json
          npm install -g --no-audit --no-fund @bubblewrap/cli@1.27.0  # targetSdk 36; a newer one when Play asks for a newer target
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          # The splash is the web boot screen's bare ground, never the icon (owner, Nov 25; README.md): an empty picture
          # for Bubblewrap's icon-on-a-square, over backgroundColor (the light ground) or, in a dark phone, the dark one
          n=0
          for f in app/src/main/res/drawable-*/splash.png; do
            echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII= | base64 -d > "$f"
            n=$((n + 1))
          done
          [ "$n" -eq 5 ] || { echo "::error::expected Bubblewrap's 5 splash.png, found $n"; exit 1; }
          mkdir -p app/src/main/res/values-night
          printf '<resources>\n    <color name="backgroundColor">#000000</color>\n</resources>\n' > app/src/main/res/values-night/colors.xml
          grep -nE "targetSdkVersion|compileSdkVersion|versionCode|applicationId" app/build.gradle
          # Play takes new apps and updates only at API 36 since 31 Aug 2026 (it rises each August: then a newer Bubblewrap)
          grep -qE "targetSdkVersion[ =]+36\b" app/build.gradle || { echo "::error::targetSdkVersion isn't 36: Play refuses the upload"; exit 1; }
      - name: Build the bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Sign with the upload key
        env:
          KEYSTORE: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_UPLOAD_KEYSTORE || '' }}
          PW: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_UPLOAD_PASSWORD || 'throwaway-pr-key' }}
        run: |
          ks="$RUNNER_TEMP/upload.jks"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ -n "$KEYSTORE" ] && [ -n "$PW" ] || { echo "::error::add the secrets ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_PASSWORD (android/README.md)"; exit 1; }
            (umask 077; printf %s "$KEYSTORE" | base64 -d > "$ks")
          else  # a PR: the same signing, with a key made here and thrown away
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=throwaway" -storepass:env PW -keypass:env PW
          fi
          jarsigner -keystore "$ks" -storepass:env PW -keypass:env PW -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "kbtuapp-$CODE.aab" app/build/outputs/bundle/release/app-release.aab upload
          [[ "$(jarsigner -verify "kbtuapp-$CODE.aab")" == *"jar verified."* ]]
          # the upload certificate's fingerprint is public: one of the two for ANDROID_CERT_SHA256 on the server
          keytool -list -v -keystore "$ks" -storepass:env PW -alias upload | grep -m1 "SHA256:"
          rm -f "$ks"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kbtuapp-${{ env.CODE }}
          path: android/kbtuapp-${{ env.CODE }}.aab
          if-no-files-found: error
          retention-days: 30
