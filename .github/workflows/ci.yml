# Runs on every push to main and every PR: English outside the UI strings, the server tests, the web types and the web unit tests,
# and the e2e suite (web/e2e: the flows and the screen snapshots).
# A PR skips the server tests when it changes only web/, *.md or issue templates, and the web checks when it changes
# only server/ or docs. The e2e tests run when either suite does. A push to main runs everything.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read  # the token can read the code and nothing else
jobs:
  english:
    # the pre-commit hook (.githooks/pre-commit) on what this PR or push adds: Cyrillic only in the UI strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |  # a push whose "before" isn't in the history (a force push): its last commit alone
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          .githooks/pre-commit "$base"
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.f.outputs.server }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo server=true >> "$GITHUB_OUTPUT"; echo web=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          docs='\.md$|^\.github/ISSUE_TEMPLATE/'
          # a job runs when any changed file is outside what it may ignore
          echo "server=$(grep -qvE "^web/|$docs" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$(grep -qvE "^server/|$docs" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
  server:
    # Filter the steps so each matrix entry still reports its required check name.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1]  # half the tests each (conftest.py's SHARD), on its own 4 cores
    steps:
      - name: Verify change detection
        run: test '${{ needs.changes.result }}' = success
      - if: needs.changes.outputs.server == 'true'
        uses: actions/checkout@v5
      - if: needs.changes.outputs.server == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt
      # cached .debs: the apt mirror sometimes takes minutes
      - if: needs.changes.outputs.server == 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ffmpeg tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz
      - if: needs.changes.outputs.server == 'true'
        run: pip install -r server/requirements.txt pytest==9.1.1 pytest-xdist==3.8.0
      - if: needs.changes.outputs.server == 'true'
        run: python -m pytest -q -n auto
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}/2
  web:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Verify change detection
        working-directory: .
        run: test '${{ needs.changes.result }}' = success
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@v5
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: needs.changes.outputs.web == 'true'
        run: npm ci --no-audit --no-fund
      - if: needs.changes.outputs.web == 'true'
        run: npm run check
      - if: needs.changes.outputs.web == 'true'
        run: npm test
      - if: needs.changes.outputs.web == 'true'
        run: npm run build  # incl. the old-iOS regex check
      - if: needs.changes.outputs.web == 'true'
        run: npm run size  # the first screen's gzipped JS and CSS against size-budget.json; the table goes to the job summary
  e2e:
    # the built app on qa.py's seeded servers, in Chromium at 375x812 from Playwright's Linux image (web/e2e/linux.sh,
    # the same pixels as on a Mac): the flows in two halves, the screen snapshots (both themes) and Telegram on Android
    # (e2e/android.spec.ts: its numbers in the job summary) beside them
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ["--project=chromium-375-dark --shard=1/2", "--project=chromium-375-dark --shard=2/2", "--project=snap-dark --project=snap-light", "--project=android"]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Verify change detection
        working-directory: .
        run: test '${{ needs.changes.result }}' = success
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        uses: actions/checkout@v5
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the browser's image comes down while the rest installs
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        run: docker pull -q "mcr.microsoft.com/playwright:v$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)-noble" &
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        run: pip install -r ../server/requirements.txt
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        run: npm ci --no-audit --no-fund
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        run: npm run build
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.server == 'true'
        run: e2e/linux.sh ${{ matrix.part }}
        env:
          QA_PYTHON: python
      # what changed, for the maintainer: each failing snapshot's expected, actual and diff pictures, and the traces
      - if: failure() && needs.changes.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ strategy.job-index }}
          path: |
            web/e2e/results
            web/e2e/report
          retention-days: 14
