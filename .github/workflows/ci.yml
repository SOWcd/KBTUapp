# Runs on every push to main and every PR: English outside the UI strings, the server tests, the web types and the web unit tests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  english:
    # the pre-commit hook (.githooks/pre-commit) on what this PR or push adds: Cyrillic only in the UI strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |  # a push whose "before" isn't in the history (a force push): its last commit alone
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          .githooks/pre-commit "$base"
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz
      - run: pip install -r server/requirements.txt pytest==9.1.1
      - run: python -m pytest -q
        working-directory: server
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build  # incl. the old-iOS regex check
