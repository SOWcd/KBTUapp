# Runs on every push to main and every PR: the server tests, the web types and the web unit tests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz
      - run: pip install -r server/requirements.txt pytest==9.1.1
      - run: python -m pytest -q
        working-directory: server
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
