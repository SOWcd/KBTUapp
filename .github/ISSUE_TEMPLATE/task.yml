name: Task for a helper
description: One small, checkable change for an outside contributor or their AI agent.
labels: ["helper task"]
body:
  - type: textarea
    id: do
    attributes:
      label: Do
      description: What to change, where. One area.
    validations:
      required: true
  - type: textarea
    id: dont
    attributes:
      label: Don't touch
      description: Files, behaviour and looks that must stay as they are.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Check (paste the output in the PR)
      description: Commands that prove it works.
      render: bash
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Agents: read AGENTS.md and CONTRIBUTING.md first. Don't ask the person running you; decide small things yourself and say why in the PR."
