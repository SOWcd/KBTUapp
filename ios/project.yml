# The iPhone app: a thin native shell over https://kbtu.sow.kz (ios/README.md). XcodeGen makes the Xcode project from
# this file on the CI runner (.github/workflows/ios.yml); the .xcodeproj is never committed. BUNDLE_ID and TEAM_ID
# come from the environment there.
name: KBTUApp
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${TEAM_ID}
targets:
  KBTUApp:
    type: application
    platform: iOS
    sources:
      - KBTUApp
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: KBTUApp
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
    entitlements:
      path: KBTUApp/KBTUApp.entitlements
      properties:
        aps-environment: production
        com.apple.developer.applesignin: [Default]
    info:
      path: KBTUApp/Info.plist
      properties:
        CFBundleDisplayName: KBTU App
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, kk]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Ground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        NSCameraUsageDescription: The door scanner reads tickets' and badges' QR codes.
        KBHome: https://kbtu.sow.kz/
