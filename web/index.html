<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- the iPhone's status bar (the home-screen app; iOS 26.1 lets no page draw under it) and the browser's own bars take
     this colour: each theme's ground, the very colour of the page's top edge, so the bar and the page are one surface.
     The system's theme until the script below and the app (lib/tg.ts paint) put the person's own -->
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KBTU App">
<title>KBTU App</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<script>
// The boot screen (#boot in the body: the lights and the mark, painted with the page, long before the bundle): outside
// Telegram only (a browser, the home-screen app), in the theme the app will pick (state/theme: the kept choice, else the system's)
(function () {
  var t = null;
  try { if (/tgWebAppData=./.test(location.hash) || /"tgWebAppData":"./.test(sessionStorage.getItem('__telegram__initParams') || '')) return; } catch (e) {}
  if (/^\/(show|screen)\/?$/.test(location.pathname)) return;
  try { t = localStorage.getItem('kb-theme'); } catch (e) {}
  document.documentElement.dataset.boot = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  // the status bar's colour: this theme's ground, whichever the system's is
  var c = document.documentElement.dataset.boot === 'light' ? '#F2F2F7' : '#000000', m = document.querySelectorAll('meta[name="theme-color"]');
  for (var i = 0; i < m.length; i++) m[i].content = c;
  // The home-screen app on an iPhone: the launch picture covers the whole screen, the page begins under the status
  // bar (the window is shorter by it), so 45% of the window would sit lower than the picture's 45% of the screen and
  // the emblem would jump as the page takes over. There the emblem stands where the picture has it: 55% of the screen
  // above the window's bottom edge, which is the screen's. The CSS works it out from the window's height at layout,
  // never this script: this early innerHeight can still be the whole screen's (the emblem then sat a status bar lower).
  try { if (navigator.standalone && screen.width < 500) document.documentElement.style.setProperty('--kb-em', 'calc(100% - ' + screen.height * .55 + 'px)'); } catch (e) {}
})();
</script>
<!-- The boot screen: the emblem on the ground, its centre at 45% of the height (the optical centre; --kb-em, set above,
     is that same point of the launch picture in the home-screen app). Its still first frame (the ground and the mark)
     is the home-screen app's launch picture (tools/splash.mjs draws public/splash from this very CSS: change it, run
     the tool), and the mark never moves from there. The app is often up within half a second, so everything is said in
     ~0.65 s, around the still mark: the ground's own lights (the entrance's, at a fraction) come up as a quiet field,
     the legend settles onto its circle, three hairline arcs swing in past it into the screen, a shade crosses the columns
     (and again every few seconds while a slow line loads).
     lib/boot.ts hands it over: .o = the emblem settles back a little and dissolves with the ground while the app
     lifts into place under it, 0.28 s (transitions on #boot and .em, the intro on their children: the two compose, so
     an app ready early still gets a whole gesture; it waits only for the 0.4 s since the first paint to pass);
     .u = under the page as the entrance's ground: its lights wake fully, the legend and the arcs go, and the entrance
     draws its own mark where this one stood and glides it into place. Transform and opacity of HTML boxes only: all on
     the compositor, running while the bundle keeps the main thread busy. -->
<style id="boot-css">
html[data-boot]{background:#000000}
html[data-boot=light]{background:#F2F2F7}
#boot{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;overflow:hidden;pointer-events:none;color:#F4F6FF;background:#000000;transition:opacity .28s cubic-bezier(.2,.7,.3,1)}
[data-boot] #boot{display:block}
[data-boot=light] #boot{color:#0B1433;background:#F2F2F7}
#boot.u{z-index:auto}
#boot.o{opacity:0}
#boot b{--u:min(1vmin,6px);position:absolute;left:calc(50% + (var(--x) - 70)*var(--u));top:calc(50% + (var(--y) - 70)*var(--u));width:calc(140*var(--u));height:calc(140*var(--u));background:radial-gradient(closest-side,var(--c),transparent);opacity:calc(var(--o)*.5);transition:opacity 1.4s cubic-bezier(.4,0,.2,1);animation:kb-drift 24s ease-in-out infinite alternate paused,kb-on .7s cubic-bezier(.2,.8,.2,1) backwards}
#boot b:nth-child(1){--c:#3B6BFF;--o:.5;--x:-45;--y:-70;--dx:16%;--dy:10%}
#boot b:nth-child(2){--c:#7C4DFF;--o:.42;--x:50;--y:80;--dx:-14%;--dy:-12%;animation-duration:29s,.7s}
#boot b:nth-child(3){--c:#30B0C7;--o:.16;--x:45;--y:-20;--dx:-22%;--dy:18%;animation-duration:34s,.7s}
[data-boot=light] #boot b:nth-child(1){--o:.3}
[data-boot=light] #boot b:nth-child(2){--o:.26}
[data-boot=light] #boot b:nth-child(3){--o:.14}
#boot.u b{opacity:var(--o);animation-play-state:running}
#boot .em{position:absolute;left:50%;top:45%;width:216px;height:216px;margin:-108px 0 0 -108px;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
@media (orientation:portrait){#boot .em{top:var(--kb-em,45%)}}
#boot.o .em{transform:scale(.96)}
/* the app lifts into place under it (a phone only: on a wider screen #app's own transform centres its column, base.css) */
@media (max-width:599.98px){#boot.o+#app{animation:kb-lift .32s cubic-bezier(.2,.8,.2,1)}}
@keyframes kb-lift{from{transform:translateY(8px)}}
/* three hairline arcs past the legend, the outer one wider than a phone: parts of the emblem's circles, each bright at its
   head and fading out along its tail, swung into place as if drawn and then going round very slowly, the middle one the other
   way, a small point of light at its head (a ring of conic gradient cut to a hairline by a mask; u swings in, its :before goes round) */
#boot u{position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);transition:opacity .28s;animation:kb-arc .9s cubic-bezier(.16,1,.3,1) .05s backwards}
#boot u:before,#boot u:nth-of-type(2):after{content:'';position:absolute;transform:rotate(var(--a)) scaleX(var(--s,1));animation:kb-round var(--t) linear infinite}
#boot u:before{top:0;right:0;bottom:0;left:0;border-radius:50%;opacity:var(--o);background:conic-gradient(transparent calc(100% - var(--l)),calc(100% - var(--l)*.35),currentColor calc(100% - var(--h,.8%)),transparent);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 1.6px),#000 calc(100% - 1px));mask:radial-gradient(closest-side,transparent calc(100% - 1.6px),#000 calc(100% - 1px))}
#boot u:nth-of-type(2):after{left:50%;top:-1.25px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.9;transform-origin:50% calc(var(--d)/2 + 1.25px)}
#boot u:nth-of-type(1){--d:324px;--o:.5;--a:20deg;--e:380deg;--l:54%;--t:150s}
#boot u:nth-of-type(2){--d:412px;--o:.36;--a:150deg;--e:-210deg;--s:-1;--l:20%;--t:90s;--r:100deg;--h:0%;animation-delay:.11s}
#boot u:nth-of-type(3){--d:500px;--o:.28;--a:40deg;--e:400deg;--l:30%;--t:210s;animation-delay:.17s}
#boot .lg{position:absolute;left:0;top:0;transition:opacity .28s;animation:kb-in .6s cubic-bezier(.2,.8,.2,1) backwards}
#boot .lg svg{display:block;animation:kb-turn 90s linear infinite}
#boot .lg text{font:600 10.5px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;fill:currentColor;opacity:.78}
#boot .lg circle{fill:none;stroke:currentColor;stroke-width:.75;opacity:.3}
#boot .mk{position:absolute;left:80px;top:84px;width:56px;height:48px}
#boot .mk i{position:absolute;top:14px;width:6px;height:22px;border-radius:3px;background:currentColor;animation:kb-col 3.9s .06s infinite backwards}
#boot .mk i:nth-child(1){left:2px;top:3px;width:52px;height:8px;animation:none}
#boot .mk i:nth-child(2){left:4px}
#boot .mk i:nth-child(3){left:14.5px;animation-delay:.1s}
#boot .mk i:nth-child(4){left:25px;animation-delay:.14s}
#boot .mk i:nth-child(5){left:35.5px;animation-delay:.18s}
#boot .mk i:nth-child(6){left:46px;animation-delay:.22s}
#boot .mk i:nth-child(7){left:0;top:39px;width:56px;height:6px;animation:none}
#boot.u .lg,#boot.u u{opacity:0}
#boot.u .mk{visibility:hidden}
@keyframes kb-drift{to{transform:translate3d(var(--dx),var(--dy),0) scale(1.12)}}
@keyframes kb-turn{to{transform:rotate(1turn)}}
@keyframes kb-on{from{opacity:0}}
@keyframes kb-arc{from{opacity:0;transform:rotate(var(--r,-100deg))}}
@keyframes kb-round{to{transform:rotate(var(--e)) scaleX(var(--s,1))}}
@keyframes kb-in{from{opacity:0;transform:rotate(-20deg) scale(.94)}}
/* a shade crosses the colonnade: each column dims and clears a beat after its neighbour, ~0.5 s of the 3.9 s round */
@keyframes kb-col{0%{opacity:1}3%{opacity:.38}9%,100%{opacity:1}}
/* The iPhone's status bar (the home-screen app) is a strip in theme-color, the ground's colour, that no page draws
   under: the lights fade into the plain ground before the top edge, so the strip and the page are one surface. */
#boot:after{content:'';position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 160px);background:linear-gradient(#000000 12%,rgba(0,0,0,.62) 40%,rgba(0,0,0,.2) 72%,rgba(0,0,0,0))}
[data-boot=light] #boot:after{background:linear-gradient(#F2F2F7 12%,rgba(242,242,247,.62) 40%,rgba(242,242,247,.2) 72%,rgba(242,242,247,0))}
@media (prefers-reduced-motion:reduce){#boot.o+#app{animation:none}#boot b,#boot u,#boot u:before,#boot u:after,#boot .lg,#boot .lg svg,#boot .mk i{animation:none!important}#boot,#boot .em,#boot b,#boot u,#boot .lg{transition:none!important}}
</style>

<link rel="preconnect" href="https://telegram.org">
<!-- deferred: parsing and the first paint don't wait for telegram.org; it still runs before the app module -->
<script defer src="https://telegram.org/js/telegram-web-app.js?59"></script>
<script>
// The first data is asked for with the page, not after the bundle has downloaded and run (Fast 3G: the calls began at
// 3.5 s, then shared the line with the sheets' chunks). The calls the app makes first (loadMe, loadAfisha, loadChats),
// signed with the launch's initData read as telegram-web-app.js reads it; api/client.ts takes each answer once, early,
// and only for that same initData. Nothing else is read or sent.
(function () {
  if (/^\/(show|screen)\/?$/.test(location.pathname) || !window.fetch) return;
  var d = '';
  try { d = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData') || ''; } catch (e) {}
  if (!d) try { d = JSON.parse(sessionStorage.getItem('__telegram__initParams') || '{}').tgWebAppData || ''; } catch (e) {}
  if (!d) return;
  var r = {};
  ['/me', '/events', '/orgs', '/me/schedule', '/posts?scope=all', '/chats'].forEach(function (p) {
    r[p] = fetch('/api' + p, { headers: { Authorization: 'tma ' + d } });
    r[p].catch(function () {}); // a failure is the app's to see, when it takes the answer
  });
  window.__kbFirst = { auth: d, at: Date.now(), r: r };
})();
</script>
<script>
// V8 sets up ICU on a page's first Intl.DateTimeFormat: ~90 ms at 4x CPU, and it fell inside the task before the first
// paint (the Afisha's date line); here it runs in a task of its own while the bundle downloads (later ones take <1 ms)
setTimeout(function () { try { new Intl.DateTimeFormat('ru-RU', { weekday: 'long', timeZone: 'UTC' }).format(0); } catch (e) {} });
</script>
<script>
// A blank screen is the worst failure: nobody can tell whether the app arrived at all.
// Errors before and during start are printed right on the page.
(function () {
  function show(msg) {
    var el = document.getElementById('app') || document.body, b = document.getElementById('boot');
    if (b) b.parentNode.removeChild(b); // the boot screen lies over the app
    el.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;padding:16px;margin:0;' +
      'font:13px/1.5 ui-monospace,monospace;color:#ff9d8a;background:#000000;min-height:100vh">' +
      'KBTU App не запустился\n\n' + String(msg).replace(/[<>&]/g, '') + '</pre>';
  }
  // Browser extensions (Safari's included) run in the page and throw their own errors, e.g. "Invalid call to
  // runtime.sendMessage(). Tab not found.": not ours, never a reason to cover the app.
  function foreign(x) { return /-extension:\/\/|runtime\.sendMessage/.test(String(x && (x.stack || x.message) || x || '')); }
  window.addEventListener('error', function (e) {
    if (foreign(e.filename) || foreign(e.error) || foreign(e.message)) return;
    // telegram-web-app.js comes from another origin: its failures arrive as a bare "Script error."
    // that can't be fixed or told apart from ad-blocker noise. Not worth covering a working app.
    if ((e.message || '') === 'Script error.' && !e.filename) return;
    if (window.__kbStarted) return; // after start, errors go to the console only
    show((e.message || e.error) + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (window.__kbStarted || foreign(e.reason)) return;
    show('promise: ' + (e.reason && e.reason.message || e.reason));
  });
  // (the boot screen is no blank screen: under it a slow line gets longer before the page gives up)
  setTimeout(function () {
    var a = document.getElementById('app');
    if (a && !a.children.length) show('модуль загрузился, но ничего не отрисовалось');
  }, document.documentElement.dataset.boot ? 20000 : 6000);
})();
</script>
