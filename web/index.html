<script>
// The boot screen (#boot in the body: the lights and the mark, painted with the page, long before the bundle): outside
// Telegram only (a browser, the home-screen app), in the theme the app will pick (state/theme: the kept choice, else the system's)
(function () {
  var t = null;
  try { if (/tgWebAppData=./.test(location.hash) || /"tgWebAppData":"./.test(sessionStorage.getItem('__telegram__initParams') || '')) return; } catch (e) {}
  if (/^\/(show|screen)\/?$/.test(location.pathname)) return;
  try { t = localStorage.getItem('kb-theme'); } catch (e) {}
  document.documentElement.dataset.boot = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
})();
</script>
<!-- The boot screen. Its still first frame (the ground and the mark) is the home-screen app's launch picture
     (tools/splash.mjs draws public/splash from this very CSS: change it, run the tool). Then the lights wake and drift, a glint crosses the mark, a glow breathes under it.
     lib/boot.ts hands it over: .u = under the page, its ground of lights from then on (the entrance draws its own .kb-mark
     where this one stood and glides it into place); .o = fading away over the app. Transform and opacity only. -->
<style id="boot-css">
#boot{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;overflow:hidden;pointer-events:none;background:#07080F;transition:opacity .42s cubic-bezier(.4,0,.2,1)}
[data-boot] #boot{display:block}
[data-boot=light] #boot{background:#F3F5FB}
#boot.u{z-index:auto}
#boot.o{opacity:0}
#boot b{--u:min(1vmin,6px);position:absolute;left:calc(50% + (var(--x) - 70)*var(--u));top:calc(50% + (var(--y) - 70)*var(--u));width:calc(140*var(--u));height:calc(140*var(--u));background:radial-gradient(closest-side,var(--c),transparent);opacity:var(--o);will-change:transform;animation:kb-drift 24s ease-in-out infinite alternate,kb-wake 1.4s cubic-bezier(.4,0,.2,1) both}
#boot b:nth-child(1){--c:#3B6BFF;--o:.5;--x:-45;--y:-70;--dx:16%;--dy:10%}
#boot b:nth-child(2){--c:#7C4DFF;--o:.42;--x:50;--y:80;--dx:-14%;--dy:-12%;animation-duration:29s,1.4s}
#boot b:nth-child(3){--c:#30B0C7;--o:.16;--x:45;--y:-20;--dx:-22%;--dy:18%;animation-duration:34s,1.4s}
[data-boot=light] #boot b:nth-child(1){--o:.3}
[data-boot=light] #boot b:nth-child(2){--o:.26}
[data-boot=light] #boot b:nth-child(3){--o:.14}
#boot>s{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;transition:opacity .4s}
#boot.u>s{opacity:0}
#boot s s{display:block;width:100%;height:100%;background:radial-gradient(closest-side,#3B6BFF,transparent);opacity:0;animation:kb-halo 2.6s ease-in-out .35s infinite}
.kb-mark{position:relative;display:flex;align-items:center;justify-content:center;width:88px;height:88px;border-radius:26%;overflow:hidden;color:#fff;background:linear-gradient(135deg,#2A4FD6,#5B2BC0);box-shadow:inset 0 1px 1px rgba(255,255,255,.16),inset 0 -8px 14px -8px rgba(0,0,0,.3),inset 1.5px 0 1px -.5px rgba(255,120,200,.32),inset -1.5px 0 1px -.5px rgba(90,190,255,.36),0 18px 40px -14px #3B6BFF}
.kb-mark i{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.4) 50%,transparent 66%);transform:translateX(-100%);animation:kb-glint 2.6s cubic-bezier(.4,0,.2,1) .35s infinite}
#boot .kb-mark{position:absolute;left:50%;top:50%;margin:-44px 0 0 -44px;transition:transform .42s cubic-bezier(.4,0,.2,1)}
#boot.u .kb-mark{visibility:hidden}
#boot.o .kb-mark{transform:scale(1.2)}
@keyframes kb-drift{to{transform:translate3d(var(--dx),var(--dy),0) scale(1.12)}}
@keyframes kb-wake{from{opacity:0}}
@keyframes kb-glint{0%{transform:translateX(-100%)}40%,to{transform:translateX(100%)}}
@keyframes kb-halo{0%{opacity:0;transform:scale(.7)}45%{opacity:.5;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){#boot b,#boot s s,.kb-mark i{animation:none}#boot,#boot .kb-mark{transition:none}}
</style>

<link rel="preconnect" href="https://telegram.org">
<!-- deferred: parsing and the first paint don't wait for telegram.org; it still runs before the app module -->
<script defer src="https://telegram.org/js/telegram-web-app.js?59"></script>
<script>
// The first data is asked for with the page, not after the bundle has downloaded and run (Fast 3G: the calls began at
// 3.5 s, then shared the line with the sheets' chunks). The calls the app makes first (loadMe, loadAfisha, loadChats),
// signed with the launch's initData read as telegram-web-app.js reads it; api/client.ts takes each answer once, early,
// and only for that same initData. Nothing else is read or sent.
(function () {
  if (/^\/(show|screen)\/?$/.test(location.pathname) || !window.fetch) return;
  var d = '';
  try { d = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData') || ''; } catch (e) {}
  if (!d) try { d = JSON.parse(sessionStorage.getItem('__telegram__initParams') || '{}').tgWebAppData || ''; } catch (e) {}
  if (!d) return;
  var r = {};
  ['/me', '/events', '/orgs', '/me/schedule', '/posts?scope=all', '/chats'].forEach(function (p) {
    r[p] = fetch('/api' + p, { headers: { Authorization: 'tma ' + d } });
    r[p].catch(function () {}); // a failure is the app's to see, when it takes the answer
  });
  window.__kbFirst = { auth: d, at: Date.now(), r: r };
})();
</script>
<script>
// V8 sets up ICU on a page's first Intl.DateTimeFormat: ~90 ms at 4x CPU, and it fell inside the task before the first
// paint (the Afisha's date line); here it runs in a task of its own while the bundle downloads (later ones take <1 ms)
setTimeout(function () { try { new Intl.DateTimeFormat('ru-RU', { weekday: 'long', timeZone: 'UTC' }).format(0); } catch (e) {} });
</script>
<script>
// A blank screen is the worst failure: nobody can tell whether the app arrived at all.
// Errors before and during start are printed right on the page.
(function () {
  function show(msg) {
    var el = document.getElementById('app') || document.body, b = document.getElementById('boot');
    if (b) b.parentNode.removeChild(b); // the boot screen lies over the app
    el.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;padding:16px;margin:0;' +
      'font:13px/1.5 ui-monospace,monospace;color:#ff9d8a;background:#07080F;min-height:100vh">' +
      'KBTU App не запустился\n\n' + String(msg).replace(/[<>&]/g, '') + '</pre>';
  }
  window.addEventListener('error', function (e) {
    // telegram-web-app.js comes from another origin: its failures arrive as a bare "Script error."
    // that can't be fixed or told apart from ad-blocker noise. Not worth covering a working app.
    if ((e.message || '') === 'Script error.' && !e.filename) return;
    if (window.__kbStarted) return; // after start, errors go to the console only
    show((e.message || e.error) + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (window.__kbStarted) return;
    show('promise: ' + (e.reason && e.reason.message || e.reason));
  });
  setTimeout(function () {
    var a = document.getElementById('app');
    if (a && !a.children.length) show('модуль загрузился, но ничего не отрисовалось');
  }, 6000);
})();
</script>
