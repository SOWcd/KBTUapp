<!doctype html>
<!-- Diagnostic for the iOS 26 home-screen app's height (WebKit 301108): add this page to the Home Screen, open it,
     screenshot. ?t=1 installs it with the black-translucent status bar instead of the default one. Delete when fixed. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VP test">
<meta name="theme-color" content="#000000">
<script>if (/[?&]t=1/.test(location.search)) document.write('<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">');</script>
<title>VP test</title>
<style>
html,body{margin:0;background:#000000;color:#fff;font:15px/1.35 -apple-system,system-ui,sans-serif}
#out{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;white-space:pre;font-family:ui-monospace,monospace;font-size:13px}
.ln{position:absolute;left:0;right:0;height:0;border-top:3px solid;font:bold 12px ui-monospace,monospace;padding-left:8px}
.ln span{position:relative;top:-18px}
#fix{position:fixed;left:0;right:0;bottom:0;height:6px;background:#0f0}
.probe{position:absolute;top:0;width:1px;visibility:hidden}
</style></head><body>
<div class="probe" id="lvh" style="height:100lvh"></div><div class="probe" id="svh" style="height:100svh"></div>
<div class="probe" id="dvh" style="height:100dvh"></div><div class="probe" id="vh" style="height:100vh"></div>
<div class="probe" id="sat" style="height:env(safe-area-inset-top)"></div><div class="probe" id="sab" style="height:env(safe-area-inset-bottom)"></div>
<div id="fix"></div><pre id="out"></pre>
<!-- link test: how an outside link best leaves the home-screen app (GitHub's universal link left a blank sheet) -->
<div id="lk" style="position:absolute;left:12px;right:12px;top:50%;display:grid;gap:10px">
<button onclick="event.stopPropagation();window.open('https://github.com/SOWcd/KBTUapp','_blank','noopener')">A: window.open</button>
<a href="https://github.com/SOWcd/KBTUapp" target="_blank" rel="noopener" onclick="event.stopPropagation()">B: link, new tab</a>
<a href="https://github.com/SOWcd/KBTUapp" onclick="event.stopPropagation()">C: link, same window</a>
<button onclick="event.stopPropagation();location.href='x-safari-https://github.com/SOWcd/KBTUapp'">D: open in Safari</button>
</div>
<style>#lk button,#lk a{display:block;padding:14px;border-radius:14px;background:#1d2030;color:#fff;font:600 16px system-ui;text-align:center;text-decoration:none;border:0}</style>
<script>
var h = function (id) { return document.getElementById(id).getBoundingClientRect().height; };
function run() {
  document.querySelectorAll('.ln').forEach(function (e) { e.remove(); });
  var sh = innerWidth > innerHeight ? screen.width : screen.height, ih = innerHeight;
  var lines = [['red', 'screen', sh], ['yellow', '100lvh', h('lvh')], ['cyan', 'inner', ih], ['magenta', '(screen+inner)/2', (sh + ih) / 2]];
  lines.forEach(function (l) {
    var d = document.createElement('div'); d.className = 'ln'; d.style.top = (l[2] - 3) + 'px'; d.style.borderColor = l[0]; d.style.color = l[0];
    d.innerHTML = '<span>' + l[1] + ' ' + Math.round(l[2]) + '</span>'; document.body.appendChild(d);
  });
  document.getElementById('out').textContent = [
    'standalone ' + navigator.standalone + '  translucent ' + /t=1/.test(location.search),
    'screen ' + screen.width + 'x' + screen.height + '  dpr ' + devicePixelRatio,
    'inner ' + innerWidth + 'x' + innerHeight + '  outer ' + outerWidth + 'x' + outerHeight,
    'client ' + document.documentElement.clientHeight + '  visualVp ' + (window.visualViewport ? Math.round(visualViewport.height) : '-'),
    'vh ' + h('vh') + '  svh ' + h('svh') + '  lvh ' + h('lvh') + '  dvh ' + h('dvh'),
    'safe top ' + h('sat') + '  bottom ' + h('sab'),
    'fixed bottom:0 bar at ' + Math.round(document.getElementById('fix').getBoundingClientRect().bottom),
    '', 'Which coloured line touches the very bottom edge?', 'Green bar = position:fixed bottom:0.', 'Tap to re-measure.'].join('\n');
}
addEventListener('resize', run); addEventListener('click', run); run(); setTimeout(run, 500);
</script></body></html>
