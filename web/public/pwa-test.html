<!doctype html>
<!-- ponytail: a throwaway spike page (does Telegram sign-in return into an installed iPhone PWA?). Nothing leaves the
     phone: the sign-in result is only shown and kept in this page's localStorage. Delete after the test. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KBTU test">
<link rel="manifest" href="/pwa-test.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>KBTU test</title>
<style>body{font:17px -apple-system,system-ui,sans-serif;background:#000;color:#fff;padding:24px 16px;margin:0}
b{color:#7cf}p{margin:10px 0}button{font:inherit;padding:10px 16px;border-radius:12px;border:0;margin:6px 0}</style>
</head><body>
<h2>KBTU PWA test</h2>
<p>Standalone (from the home screen): <b id="sa"></b></p>
<p>Opens of this copy: <b id="n"></b> (grows = state kept)</p>
<p>Last sign-in: <b id="who">none</b></p>
<p>1. Popup sign-in:</p>
<script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="KBTUappBot" data-size="large" data-onauth="got(user,'popup')" data-request-access="write"></script>
<p>2. Redirect sign-in:</p>
<script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="KBTUappBot" data-size="large" data-auth-url="https://kbtu.sow.kz/pwa-test.html"></script>
<p><button onclick="localStorage.clear();location.replace('/pwa-test.html')">Reset</button></p>
<script>
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
document.getElementById('sa').textContent = (navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? 'YES' : 'no (Safari/Telegram)';
const n = +(ls('n') || 0) + 1; ls('n', n); document.getElementById('n').textContent = n;
function got(u, how) {
  const where = (navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? 'in the app' : 'in Safari';
  ls('who', `${u.first_name} (${how}, landed ${where}, ${new Date().toLocaleTimeString()})`); show();
}
function show() { document.getElementById('who').textContent = ls('who') || 'none'; }
const q = new URLSearchParams(location.search);
if (q.get('id')) { got({ first_name: q.get('first_name') || q.get('id') }, 'redirect'); history.replaceState(null, '', '/pwa-test.html'); }
show();
document.addEventListener('visibilitychange', show);
</script>
</body></html>
