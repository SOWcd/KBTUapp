  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: black; color: #f7f7f4; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { position: relative; width: 100%; height: 100%; user-select: none; touch-action: pan-y pinch-zoom; }
  #stage { display: block; width: 100%; height: 100%; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .control { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .control:focus { outline: none; }
  .control:focus-visible .hit { stroke: #f4f4ef; stroke-width: 2; }
  .control:hover .button-surface { fill: #282829; }
  .incoming .line { animation: uncover .94s cubic-bezier(.19,.8,.24,1) both; animation-delay: var(--delay, 0ms); }
  .incoming .appear { animation: appear .94s cubic-bezier(.19,.8,.24,1) both; animation-delay: var(--delay, 70ms); }
  .incoming .object { animation: place 1.2s cubic-bezier(.19,.8,.24,1) both; }
  .outgoing { pointer-events: none; animation: leave .24s ease-out both; }
  .shot { transition: opacity .62s ease-in-out; }
  .feature-bg, .feature-rail { transition: opacity .45s ease; }
  @keyframes uncover { from { transform: translateY(90%); opacity: .1; } to { transform: none; opacity: 1; } }
  .line { transform-box: fill-box; }
  @keyframes appear { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  @keyframes place { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  if(m) s+=heading(21,217,['1 студент'],73,74)+word(23,299,'+',67,360,quiet,-2)+heading(89,299,['ИИ'],73,74);
  else s+=heading(66,444,['1 студент'],152,154)+word(810,439,'+',126,310,quiet,-5)+heading(945,444,['ИИ'],152,154);
  const xs=m?[23,203]:[73,405,732,1060], w=m?157:297;
  facets.forEach(([value,a,b],i)=>{
    const x=xs[i%(m?2:4)], y=m?377+Math.floor(i/2)*170:559;
    s+=group(move(x,y,rule(0,0,w,0,edge)+word(-1,m?59:78,value,m?39:53,580,paper,m?-2:-2.8)+
      word(0,m?93:122,a,m?15:21,440,muted,-.38)+(b?word(0,m?115:151,b,m?15:21,440,muted,-.38):'')),'appear','style="--delay:'+(100+i*70)+'ms"');
  });
  return s;
}
function qr(x,y,size) {
  return '<svg x="'+x+'" y="'+y+'" width="'+size+'" height="'+size+'" viewBox="0 0 33 33" shape-rendering="crispEdges" aria-hidden="true"><rect width="33" height="33" fill="#fff"/><path transform="translate(4 4)" d="'+qrPath+'" fill="#0a0a0a"/></svg>';
}
function ticket(x,y,w,h,m) {
  const tear=h*(m?.73:.76), r=m?18:30, q=m?177:276;
  let t=rect(0,0,w,h,r,'#171818','#393a3a')+
    rect(w/2-q/2-2,(tear-q)/2-2,q+4,q+4,m?10:15,'white')+qr((w-q)/2,(tear-q)/2,q)+
    '<path d="M10 '+tear+'H'+(w-10)+'" stroke="#4b4c4c" stroke-dasharray="3 6"/>'+
    [0,w].map(v=>'<circle cx="'+v+'" cy="'+tear+'" r="'+(m?8:12)+'" fill="black"/>').join('')+
    glyph('telegram',m?17:29,tear+(h-tear)/2-(m?10:14),m?20:28,paper)+
    word(m?48:75,tear+(h-tear)/2+(m?6:9),'t.me/KBTUappBot',m?18:29,540,paper,m?-.6:-1);
  return move(x,y,link(bot,'Открыть KBTU App в Telegram',t+rect(0,0,w,h,r,'transparent','none','class="hit"')));
}
function closing(m) {
  let s=kicker(m?24:74,m?112:227,'Дальше',m)+heading(m?21:68,m?181:343,['Следующий —','ваш университет'],m?42:82,m?48:88);
  const x=m?24:74,y=m?656:546;
  s+=group(word(x,y,'Связь с автором',m?16:21,440,muted,-.4)+link('https://t.me/Sowers','Написать автору в Telegram',word(x,y+(m?35:48),'t.me/Sowers',m?27:37,540,paper,-1.3)+
    rect(x-4,y+6,m?166:215,m?41:50,9,'transparent','none','class="hit"')),'appear');
  s+=group(ticket(m?67:895,m?285:218,m?256:375,m?284:416,m),'object');
  return s;
}
const font='Presentation Sans, Inter, -apple-system, BlinkMacSystemFont, Adwaita Sans, Arial, sans-serif';
const filters='<defs><filter id="mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/></filter></defs>';
function scene(n,m,selected) {
  return [cover,problem,product,results,build,closing][n](m,selected);
}
</script>
<script>
const stage=document.getElementById('stage');
const statusNode=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let current=0, selected=0, compact, cycleTimer, leavingTimer;
let pinned=false, lastSwipe=-Infinity, touch;
const slideLabel=()=> 'Слайд '+(current+1)+' из 6. '+titles[current];
function paint(animate=false) {
  compact=stage.clientWidth/stage.clientHeight<.93;
  stage.setAttribute('viewBox',compact?'0 0 390 844':'0 0 1440 900');
  stage.setAttribute('font-family',font);
  const previous=animate && !reduced.matches ? stage.querySelector('#content')?.innerHTML : '';
  // A short dissolve layers both slides. Outgoing controls are inert.
  clearTimeout(leavingTimer);
  stage.innerHTML=filters+(previous?group(previous,'outgoing','aria-hidden="true" inert="inert"'):'')+
    group(scene(current,compact,selected),animate?'incoming':'','id="content" aria-roledescription="слайд" aria-label="'+slideLabel()+'" role="group"')+chrome(compact,current);
  leavingTimer=setTimeout(()=>stage.querySelector('.outgoing')?.remove(),250);
  statusNode.textContent=slideLabel();
}
function pick(i) {
  selected=i;
  const content=stage.querySelector('#content');
  content.querySelectorAll('[data-shot]').forEach(el=>el.setAttribute('opacity',Number(el.dataset.shot==i)));
  content.querySelectorAll('[data-feature]').forEach(el=>{
    const active=el.dataset.feature==i;
    el.setAttribute('aria-pressed',active);
    el.querySelectorAll('.feature-bg,.feature-rail').forEach(part=>part.setAttribute('opacity',Number(active)));
  });
  const label=content.querySelector('#feature-detail');
  if(label) label.textContent=features[i][3];
}
function schedule() {
  clearTimeout(cycleTimer);
  if(current!==2 || pinned || reduced.matches || document.hidden) return;
  cycleTimer=setTimeout(()=>{
    for(let step=1;step<=features.length;step++) {
      const next=(selected+step)%features.length;
      if(!missing.has(features[next][0])) { pick(next); break; }
    }
    schedule();
  },5600);
}
function go(n) {
  n=Math.max(0,Math.min(titles.length-1,n));
  if(n===current) return;
  const focusAction=document.activeElement?.dataset.action;
  current=n;
  selected=missing.has('ticket') ? Math.max(0,features.findIndex(f=>!missing.has(f[0]))) : 2;
  pinned=false;
  paint(true); schedule();
  if(focusAction) (stage.querySelector('[data-action="'+focusAction+'"]')||stage.querySelector('[aria-current="step"]'))?.focus();
}
async function fullscreen() {
  try {
    if(document.fullscreenElement) await document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else document.documentElement.webkitRequestFullscreen?.();
  } catch { /* A browser can reserve full screen for its own controls. */ }
}
function act(action) {
  if(action==='prev') go(current-1);
  else if(action==='next') go(current+1);
  else if(action==='fullscreen') fullscreen();
  else if(action.startsWith('go-')) go(Number(action.slice(3)));
  else if(action.startsWith('feature-')) { pinned=true; pick(Number(action.slice(8))); schedule(); }
}
document.addEventListener('keydown',e=>{
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  const control=e.target.closest?.('[data-action],a');
  if(control && [' ','Enter'].includes(e.key)) {
    if(control.dataset.action) { e.preventDefault(); act(control.dataset.action); }
    else if(e.key===' ') { e.preventDefault(); control.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window})); }
    return;
  }
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)) { e.preventDefault(); go(current+1); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); go(current-1); }
  else if(e.key==='Home' || e.key==='End') { e.preventDefault(); go(e.key==='Home'?0:5); }
  else if(e.key.toLowerCase()==='f') { e.preventDefault(); fullscreen(); }
});
stage.addEventListener('click',e=>{
  if(performance.now()-lastSwipe<500) { e.preventDefault(); return; }
  const target=e.target.closest('a,[data-action]');
  if(target?.dataset.action) act(target.dataset.action);
  else if(!target) go(current+(e.clientX<innerWidth*.22?-1:1));
});
stage.addEventListener('touchstart',e=>{ touch=e.touches.length===1?e.touches[0]:null; },{passive:true});
stage.addEventListener('touchcancel',()=>{ touch=null; });
stage.addEventListener('touchend',e=>{
  if(!touch) return;
  const dx=e.changedTouches[0].clientX-touch.clientX,dy=e.changedTouches[0].clientY-touch.clientY;
  touch=null;
  if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.3) { lastSwipe=performance.now(); go(current+(dx<0?1:-1)); }
},{passive:true});
addEventListener('resize',()=>{ if((stage.clientWidth/stage.clientHeight<.93)!==compact) paint(); });
document.addEventListener('visibilitychange',schedule);
reduced.addEventListener('change',schedule);
features.forEach(([name])=>{
  const probe=new Image();
  probe.onerror=()=>{
    missing.add(name);
    if(current===2 && missing.has(features[selected][0])) selected=Math.max(0,features.findIndex(f=>!missing.has(f[0])));
    paint();
  };
  probe.src='pitch/'+name+'.png';
});
// Keep the presentation ready from a local file or a cold projector laptop.
// The inline matrix matches the Telegram link, including a four-module quiet zone.
if(location.protocol==='https:' || location.protocol==='http:') {
  const lib=document.createElement('script');
  lib.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  lib.async=true;
  lib.onload=()=>{
    const q=qrcode(0,'M'); q.addData(bot); q.make();
    let path='';
    for(let y=0;y<q.getModuleCount();y++) for(let x=0;x<q.getModuleCount();x++) if(q.isDark(y,x)) path+='M'+x+' '+y+'h1v1h-1z';
    qrPath=path;
    if(current===5) paint();
  };
  document.head.append(lib);
}
paint(true);
</script>
