* { box-sizing: border-box; margin: 0; }

.lights b { --u: min(1vmin, 6px); position: absolute; left: calc(50% + (var(--x) - 70) * var(--u)); top: calc(38% + (var(--y) - 70) * var(--u)); width: calc(140 * var(--u)); height: calc(140 * var(--u)); background: radial-gradient(closest-side, var(--c), transparent); opacity: var(--o); }

    document.title = d['h.' + v];
  }
  paint();

  // the scenes play in turn, each with its step lit; a tap on a step shows it and the play goes on from there
  var scenes = document.querySelectorAll('.scene:not([hidden])'), steps = document.querySelectorAll('li:not([hidden])'), at = 1, timer;
  function show(n) {
    at = n;
    scenes.forEach(function (sc, i) { sc.classList.toggle('on', i === n - 1); });
    steps.forEach(function (li, i) { li.classList.toggle('on', i === n - 1); });
    clearTimeout(timer); timer = setTimeout(function () { show(at % steps.length + 1); }, 2000);  // owner: 3.4 s a step felt slow
  }
  steps.forEach(function (li, i) { li.addEventListener('click', function () { show(i + 1); }); });
  if (v === 'ios' || v === 'android') show(1);

  // Android: Chrome offers its own install dialog when it finds the app installable; the steps stay as the other way
  var ask = null, install = document.getElementById('install');
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ask = e; if (v === 'android') install.hidden = false; });
  install.addEventListener('click', function () { if (ask) { ask.prompt(); ask = null; install.hidden = true; } });
  addEventListener('appinstalled', function () { v = sub = 'done'; clearTimeout(timer); install.hidden = true; paint(); });

  var copy = document.getElementById('copy');
  copy.addEventListener('click', function () {
    var url = 'https://kbtu.sow.kz/install', ok = function () { copy.textContent = d.copied; setTimeout(function () { copy.textContent = d.copy; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function () {});
    else { var r = document.createRange(); r.selectNodeContents(document.querySelector('.link')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); try { if (document.execCommand('copy')) ok(); } catch (e) {} }
  });

  // iOS takes the launch picture from the page it adds: index.html's, by this phone's size and theme
  if (v === 'ios') '440x956@3 430x932@3 428x926@3 420x912@3 414x896@3 414x896@2 402x874@3 393x852@3 390x844@3 375x812@3 375x667@2'.split(' ').forEach(function (s) {
    var m = /(\d+)x(\d+)@(\d)/.exec(s);
    ['dark', 'light'].forEach(function (th) {
      var l = document.createElement('link'); l.rel = 'apple-touch-startup-image'; l.href = '/splash/' + m[1] + 'x' + m[2] + '-' + m[3] + 'x-' + th + '.png?v=3'; // (tools/splash.mjs's names)
      l.media = '(prefers-color-scheme: ' + th + ') and (device-width: ' + m[1] + 'px) and (device-height: ' + m[2] + 'px) and (-webkit-device-pixel-ratio: ' + m[3] + ') and (orientation: portrait)';
      document.head.appendChild(l);
    });
  });
})();
