<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- The Android adaptive (maskable) icon: favicon.svg shrunk to the launcher's visible 72 of 108 dp, so the glyph keeps the size it has inside icon-512's own square; the ground runs to every edge. Render: rsvg-convert -w 512 android/icon-maskable.svg -o web/public/icon-maskable-512.png (and -w 192). -->
<defs>
  <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="153.6" y1="0" x2="563.2" y2="1024">
    <stop offset="0" stop-color="#2B4CD0"/><stop offset="0.55" stop-color="#1A2A7A"/><stop offset="1" stop-color="#0C1230"/>
  </linearGradient>
  <radialGradient id="violet" gradientUnits="userSpaceOnUse" cx="204.8" cy="20.48" r="798.72"><stop offset="0" stop-color="#8A5CFF" stop-opacity="0.75"/><stop offset="0.6" stop-color="#7C4DFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="cool" gradientUnits="userSpaceOnUse" cx="972.8" cy="1044.48" r="634.88"><stop offset="0" stop-color="#3BC8FF" stop-opacity="0.22"/><stop offset="1" stop-color="#3BC8FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="bloom" gradientUnits="userSpaceOnUse" cx="512" cy="481.28" r="409.6"><stop offset="0" stop-color="#BFD0FF" stop-opacity="0.22"/><stop offset="1" stop-color="#BFD0FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="768"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.32"/></radialGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6DEFF"/></linearGradient>
  <filter id="markGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="b"/>
    <feFlood flood-color="#C9D6FF" flood-opacity="0.45"/><feComposite in2="b" operator="in" result="g"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="s0"/><feOffset in="s0" dy="18" result="s1"/>
    <feFlood flood-color="#050818" flood-opacity="0.45"/><feComposite in2="s1" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9d7bff" stop-opacity=".75"/><stop offset=".55" stop-color="#3bc8ff" stop-opacity=".22"/><stop offset="1" stop-color="#3bc8ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e8e2ff"/><stop offset="1" stop-color="#bfe9ff"/></linearGradient>
  <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="20"/>
    <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="hv" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a77dff" stop-opacity=".8"/><stop offset="1" stop-color="#a77dff" stop-opacity="0"/></radialGradient>
  <radialGradient id="hc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3bc8ff" stop-opacity=".55"/><stop offset="1" stop-color="#3bc8ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".18" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1"><stop offset=".3" stop-color="#cbd6ff"/><stop offset=".46" stop-color="#fff"/>
    <stop offset=".52" stop-color="#fff"/><stop offset=".68" stop-color="#b9c6ff"/><stop offset="1" stop-color="#9fe0ff"/></linearGradient>
  <mask id="mk"><g transform="translate(162,212) scale(25)" fill="#fff"><rect x="1" y="1.5" width="26" height="4" rx="1.5"/><rect x="2" y="7" width="3" height="11" rx="1.5"/><rect x="7.25" y="7" width="3" height="11" rx="1.5"/><rect x="12.5" y="7" width="3" height="11" rx="1.5"/><rect x="17.75" y="7" width="3" height="11" rx="1.5"/><rect x="23" y="7" width="3" height="11" rx="1.5"/><rect x="0" y="19.5" width="28" height="3" rx="1.5"/></g></mask></defs><g transform="translate(512 512) scale(0.6667) translate(-512 -512)"><rect x="-256" y="-256" width="1536" height="1536" fill="url(#bg)"/><rect x="-256" y="-256" width="1536" height="1536" fill="url(#violet)"/><rect x="-256" y="-256" width="1536" height="1536" fill="url(#cool)"/><rect x="-256" y="-256" width="1536" height="1536" fill="url(#bloom)"/><rect x="-256" y="-256" width="1536" height="1536" fill="url(#vignette)"/><ellipse cx="400" cy="400" rx="380" ry="320" fill="url(#hv)"/><ellipse cx="650" cy="640" rx="360" ry="300" fill="url(#hc)"/><g filter="url(#lift)"><rect width="1024" height="1024" fill="url(#sweep)" mask="url(#mk)"/></g><g transform="translate(162,212) scale(25)" fill="url(#edge)"><rect x="1" y="1.5" width="26" height="4" rx="1.5"/><rect x="2" y="7" width="3" height="11" rx="1.5"/><rect x="7.25" y="7" width="3" height="11" rx="1.5"/><rect x="12.5" y="7" width="3" height="11" rx="1.5"/><rect x="17.75" y="7" width="3" height="11" rx="1.5"/><rect x="23" y="7" width="3" height="11" rx="1.5"/><rect x="0" y="19.5" width="28" height="3" rx="1.5"/></g></g></svg>
